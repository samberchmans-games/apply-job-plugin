# Acknowledges new problem reports and labels them for triage. See docs/ISSUE-REPORTING.md §7.
# Runs with the repository's own GITHUB_TOKEN (no secrets in the extension).
name: Acknowledge problem reports

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  acknowledge:
    if: contains(github.event.issue.labels.*.name, 'from-extension') || contains(github.event.issue.body, 'Report id')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const text = `${issue.title}\n${issue.body || ''}`;
            const reportId = (text.match(/R-\d{8}-[A-Z0-9]{5}/) || [])[0];
            const codes = [...new Set(text.match(/AJP-[A-Z0-9]+(?:-[A-Z0-9]+)*/g) || [])].slice(0, 5);
            const browser = ((issue.body || '').match(/### Browser\s+(\w+)/) || [])[1];
            const labels = ['needs-triage', ...codes.map((c) => `code:${c}`)];
            if (browser && browser !== 'Other') labels.push(`browser:${browser.toLowerCase()}`);
            await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels });
            const lines = [
              `Thanks for the report${reportId ? ` — we received **${reportId}**` : ''}. 🙏`,
              '',
              '**What happens next**',
              '1. We triage new reports within **3 business days** and label them (`confirmed`, `needs-info`, `duplicate`).',
              '2. When it is fixed, we close this issue with the version that contains the fix (`fixed-in:vX.Y.Z`). GitHub notifies you.',
              '',
              codes.length ? `Error code${codes.length > 1 ? 's' : ''}: ${codes.map((c) => '`' + c + '`').join(', ')} — common fixes are in the [support guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/develop/docs/SUPPORT.md#3-error-codes).` : '',
              reportId ? '' : 'Tip: a report id from Admin → Logs & support → Report an issue helps us find the cause quickly.',
              '',
              '_This issue is public. Please don\'t add personal details, resume text, API keys or job links._',
            ].filter((l, i, a) => l !== '' || a[i - 1] !== '');
            await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: lines.join('\n') });
