<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Senior Data Engineer — Acme (Workday emulation)</title>
  <style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:760px;margin:24px auto;padding:0 16px}
    [data-automation-id="progressBar"]{color:#555;margin-bottom:12px} [data-automation-id="progressBarActiveStep"]{font-weight:700;color:#0b57d0}
    label{display:block;font-size:14px;margin-bottom:3px} input,textarea{padding:5px;min-width:260px} button[aria-haspopup]{min-width:270px;text-align:left;padding:5px}
    [data-automation-id="bottom-navigation-next-button"]{margin-top:16px;background:#0b57d0;color:#fff;border:0;padding:8px 14px;border-radius:6px}
    .note{background:#fff7e0;border:1px solid #f0d58a;padding:8px 12px;border-radius:8px;font-size:14px}</style>
</head>
<body>
  <p class="note">Local Workday <b>emulation</b> for testing the extension (not Workday). Serve with <code>python3 tests/serve.py</code>, open this page, click the extension icon → Analyze → Autofill. "Save and Continue" moves to the next step.</p>
  <div id="app"></div>
  <script src="workday-mock.js"></script>
  <script>
    const app = document.getElementById('app');
    const pages = ['info', 'experience', 'eeo', 'review'];
    let i = 0;
    const show = () => {
      WorkdayMock.goTo(app, pages[i]);
      const next = app.querySelector('[data-automation-id="bottom-navigation-next-button"]');
      if (next) next.addEventListener('click', () => { if (pages[i] === 'eeo') { app.innerHTML = '<h2 data-automation-id="congratulationsPopup">Application Submitted</h2><p>Thank you for applying.</p>'; return; } i = Math.min(i + 1, pages.length - 1); show(); });
    };
    show();
  </script>
</body>
</html>
