<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Resume</title>
  <style>
    body { max-width: 780px; margin: 30px auto; padding: 0 24px; font: 11pt/1.45 Georgia, "Times New Roman", serif; color: #111; background: #fff; }
    h1 { font-size: 22pt; margin: 0 0 4px; } h2 { font-size: 12pt; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #999; margin: 18px 0 6px; padding-bottom: 2px; }
    h3 { font-size: 11pt; margin: 10px 0 2px; } ul { margin: 4px 0; padding-left: 20px; } li { margin: 2px 0; } p { margin: 4px 0; }
    .bar { position: sticky; top: 0; background: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 20px; font-family: sans-serif; font-size: 13px; }
    .bar button { margin-left: 8px; }
    @media print { .bar { display: none; } body { margin: 0 auto; } }
  </style>
</head>
<body>
  <div class="bar">Review your resume, then <button id="print">🖨 Print / Save as PDF</button> (choose “Save as PDF” as the printer).</div>
  <div id="doc"></div>
  <script src="../lib/core.js"></script>
  <script src="../lib/logger.js"></script>
  <script src="../lib/storage.js"></script>
  <script src="resume-view.js"></script>
</body>
</html>
